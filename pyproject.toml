[project]
name = "dev-tools"
version = "0"
description = "Workspace root for independent Python CLI tools."
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/image-for-agent",
    "packages/page-to-markdown",
    "packages/project-checks",
    "packages/review-feedback",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.15.22",
]

[tool.ruff]
extend-exclude = [
    "packages/page-to-markdown/src/page_to_markdown/_cli_style.py",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
pythonpath = [
    "packages/image-for-agent/src",
    "packages/page-to-markdown/src",
    "packages/project-checks/src",
    "packages/review-feedback/src",
]
