[project]
name = "dev-tools"
version = "0"
description = "Workspace root for independent Python CLI tools."
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/image-for-agent",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff>=0.15.22",
]

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = [
    "packages/image-for-agent/src",
]
