name: Publish page-to-markdown

on:
  push:
    tags:
      - "page-to-markdown-v*"

concurrency:
  group: publish-page-to-markdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Test package
        working-directory: packages/page-to-markdown
        run: uv run pytest

      - name: Build package
        working-directory: packages/page-to-markdown
        run: uv build

      - name: Publish to PyPI
        working-directory: .
        run: uv publish --trusted-publishing automatic
