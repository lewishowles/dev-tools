name: Publish page-to-markdown

on:
  push:
    tags:
      - "page-to-markdown-v*"

concurrency:
  group: publish-page-to-markdown-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Add Bun binaries to PATH
        run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Test package
        run: uv run pytest packages/page-to-markdown/tests

      - name: Build package
        working-directory: packages/page-to-markdown
        run: uv build

      - name: Publish to PyPI
        working-directory: .
        run: uv publish --trusted-publishing automatic
