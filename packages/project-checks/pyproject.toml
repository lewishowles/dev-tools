[project]
name = "project-checks"
version = "0.1.0"
description = "Run conservative project diagnostics."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
project-checks = "project_checks.diagnostics:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_checks"]
