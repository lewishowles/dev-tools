[project]
name = "project-checks"
version = "0.2.0"
description = "Run conservative project diagnostics."
authors = [{ name = "Lewis Howles" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/lewishowles/dev-tools/tree/main/packages/project-checks"
Repository = "https://github.com/lewishowles/dev-tools"

[project.scripts]
project-checks = "project_checks.diagnostics:main"
project-checks-change-impact = "project_checks.change_impact:main"
project-checks-generated-file-guard = "project_checks.generated_file_guard:main"
project-checks-markdown-claims = "project_checks.markdown_claims:main"
project-checks-repo-context = "project_checks.repo_context:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_checks"]
