<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Viewport Lab</title>
		<style>
			:root {
				color-scheme: light dark;
				font-family: system-ui, sans-serif;
			}

			body {
				background: #f5f7fb;
				box-sizing: border-box;
				color: #172033;
				margin: 0;
				min-height: 100vh;
				padding: 12px 16px;
			}

			form {
				align-items: center;
				display: flex;
				gap: 10px;
				min-height: 40px;
			}

			label {
				font-weight: 650;
				white-space: nowrap;
			}

			input,
			button {
				border: 1px solid #8994a8;
				border-radius: 6px;
				box-sizing: border-box;
				font: inherit;
				min-height: 40px;
			}

			input {
				background: #ffffff;
				color: #172033;
				flex: 1;
				min-width: 0;
				padding: 8px 10px;
			}

			button {
				background: #1d4ed8;
				color: #ffffff;
				cursor: pointer;
				padding: 8px 14px;
			}

			input:focus-visible,
			button:focus-visible {
				outline: 3px solid #1d4ed8;
				outline-offset: 2px;
			}

			@media (prefers-color-scheme: dark) {
				body {
					background: #172033;
					color: #f5f7fb;
				}

				input {
					background: #27334a;
					color: #f5f7fb;
				}

				input:focus-visible,
				button:focus-visible {
					outline-color: #f59e0b;
				}
			}
		</style>
	</head>
	<body>
		<form id="url-form">
			<label for="url-input">Page URL</label>
			<input
				id="url-input"
				name="url"
				type="url"
				inputmode="url"
				autocomplete="url"
				placeholder="https://example.com"
				spellcheck="false"
			/>
			<button type="submit">Load page</button>
		</form>
		<script src="./toolbar.js"></script>
	</body>
</html>
