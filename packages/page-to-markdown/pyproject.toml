[project]
name = "page-to-markdown"
version = "0.1.2"
description = "Convert a URL, file, or piped HTML into compact Markdown."
authors = [{ name = "Lewis Howles" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Text Processing :: Markup",
]

[project.urls]
Homepage = "https://github.com/lewishowles/dev-tools/tree/main/packages/page-to-markdown"
Repository = "https://github.com/lewishowles/dev-tools"

[project.scripts]
page-to-markdown = "page_to_markdown.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/page_to_markdown"]

[tool.pytest.ini_options]
pythonpath = ["src"]
