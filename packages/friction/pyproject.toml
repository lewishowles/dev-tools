[project]
name = "friction"
dynamic = ["version"]
description = "Store and review local agent friction events."
authors = [{ name = "Lewis Howles" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
friction = "friction.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/friction/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/friction"]

[tool.pytest.ini_options]
pythonpath = ["src"]
