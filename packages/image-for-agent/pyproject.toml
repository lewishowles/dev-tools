[project]
name = "image-for-agent"
version = "0.1.0"
description = "Offline image variant benchmark harness for agent input experiments."
authors = [{ name = "Lewis Howles" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
	"Development Status :: 3 - Alpha",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: MIT License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.11",
	"Topic :: Multimedia :: Graphics",
]

[project.urls]
Homepage = "https://github.com/lewishowles/dev-tools/tree/main/packages/image-for-agent"
Repository = "https://github.com/lewishowles/dev-tools"

[project.scripts]
image-for-agent-benchmark = "image_for_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/image_for_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
